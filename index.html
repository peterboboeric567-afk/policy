<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>晉心守護 - 醫保秘書</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f1ea; margin: 0; padding: 15px; color: #333; }
        .header { text-align: center; color: #1a4d4e; margin-bottom: 20px; border-bottom: 2px solid #d4c2a5; padding-bottom: 10px; }
        .header h1 { font-size: 24px; margin: 0 0 5px 0; }
        .header p { font-size: 14px; margin: 0; color: #666; }
        .policy-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #1a4d4e; }
        .policy-title { font-size: 18px; font-weight: bold; color: #1a4d4e; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background-color: #1a4d4e; color: white; font-size: 12px; padding: 4px 8px; border-radius: 4px; font-weight: normal; }
        .policy-detail { font-size: 15px; margin-bottom: 6px; color: #555; display: flex; justify-content: space-between; }
        .policy-footer { font-size: 13px; color: #999; margin-top: 12px; padding-top: 8px; border-top: 1px dashed #eee; display: flex; justify-content: space-between; }
        #loading { text-align: center; color: #1a4d4e; font-size: 16px; margin-top: 30px; }
        .error-msg { text-align: center; color: #d9534f; padding: 20px; background: #fdf7f7; border-radius: 8px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <h1>晉心守護</h1>
        <p>您的專屬醫保秘書 - 保單總覽</p>
    </div>
    <div id="loading">讀取保單資料中，請稍候...</div>
    <div id="error-container"></div>
    <div id="policy-list"></div>

    <script>
        const apiUrl = 'https://script.google.com/macros/s/AKfycbzrpFUium5gp3elg3RO2NiYLzshNmaAg9zjTyUNomTac3TyD8YE3rGAfpW_iBngst0G/exec';
        const myLiffId = '2011979320-UwYAb14w';

        async function initializeLiff() {
            try {
                await liff.init({ liffId: myLiffId });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    fetchPolicies(profile.userId);
                } else {
                    liff.login();
                }
            } catch (err) {
                showError("LIFF 初始化失敗，請確認在 LINE 內部開啟。");
            }
        }

        async function fetchPolicies(userLineId) {
            try {
                const response = await fetch(apiUrl + "?lineId=" + userLineId);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                const list = document.getElementById('policy-list');
                
                if (data.length === 0) {
                    list.innerHTML = `<div class="error-msg">目前系統中沒有找到您的保單資料。<br><br>💡 <b>您的專屬 LINE ID 是：</b><br><br><span style="color:blue; font-size:18px; user-select:all; background:#e0e0e0; padding:5px; border-radius:4px; word-break: break-all;">${userLineId}</span><br><br>請長按複製上方代碼，並貼到 Google 試算表的 LINE_ID 欄位即可綁定！</div>`;
                    return;
                }
                
                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'policy-card';
                    card.innerHTML = `
                        <div class="policy-title">
                            ${item['險種名稱']}
                            <span class="badge">${item['保險公司']}</span>
                        </div>
                        <div class="policy-detail">
                            <span>被保險人：<strong>${item['被保險人']}</strong></span>
                            <span>保額：<strong>${item['保額']}</strong></span>
                        </div>
                        <div class="policy-detail">
                            <span>扣款方式：${item['扣款方式']}</span>
                        </div>
                        <div class="policy-footer">
                            <span>要保人：${item['要保人']}</span>
                            <span>投保日：${item['投保日期']}</span>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                showError("無法讀取資料，請稍後再試。");
            }
        }

        window.onload = function() {
            initializeLiff();
        };
    </script>
</body>
</html>
